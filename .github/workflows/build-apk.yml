name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]          # pushing a tag like v1.0 also publishes a Release
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write         # needed only to publish Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: if you've added your own signing key as repository secrets,
      # every APK is signed with it, so new versions install over old ones.
      - name: Set up signing key (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your key."
          else
            echo "No signing key secrets found: using a temporary debug key."
          fi

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/KidsLauncher-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"

      - name: Save the APK (download from this run's Summary page)
        uses: actions/upload-artifact@v4
        with:
          name: KidsLauncher-apk
          path: out/*.apk

      - name: Publish a Release (only for tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
